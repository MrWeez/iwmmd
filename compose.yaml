name: iwmmd

services:
  iwmmd:
    image: ${IWMMD_IMAGE:-ghcr.io/mrweez/iwmmd:latest}
    restart: unless-stopped
    stop_grace_period: 20s
    env_file:
      - path: .env
        required: false
    environment:
      IWMMD_DATA_DIR: /data
    ports:
      - "${IWMMD_BIND_ADDR:-127.0.0.1}:${IWMMD_PORT:-8080}:8080"
    volumes:
      - iwmmd-data:/data
      # For a TOML config, copy config.example.toml to config.toml and mount it:
      # - ./config.toml:/etc/iwmmd/config.toml:ro
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

volumes:
  iwmmd-data:
